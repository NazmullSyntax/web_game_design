<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon 2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2bd6;
    --neon-purple: #8b5cf6;
    --neon-green: #39ff88;
    --neon-yellow: #ffe14d;
    --neon-orange: #ff8a3d;
    --neon-red: #ff3c5a;
    --bg-panel: rgba(20, 20, 45, 0.7);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1a1a3e 0%, #05050f 100%);
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }
  @keyframes gridMove { from { background-position: 0 0; } to { background-position: 40px 40px; } }

  .game-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 12px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(480px, 92vw);
    gap: 10px;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    padding: 6px 14px;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 10px;
    text-align: center;
    min-width: 74px;
    transition: transform 0.15s ease;
  }

  .score-box.bump {
    animation: scoreBump 0.25s ease;
  }
  @keyframes scoreBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
    100% { transform: scale(1); }
  }

  .score-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.5);
  }
  .score-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--neon-cyan);
    font-variant-numeric: tabular-nums;
  }
  .score-box.best .score-value {
    color: var(--neon-pink);
    text-shadow: 0 0 12px var(--neon-pink);
  }

  .toolbar {
    display: flex;
    gap: 8px;
    width: min(480px, 92vw);
    justify-content: flex-end;
  }

  .tool-btn {
    padding: 6px 14px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .tool-btn:hover:not(:disabled) {
    color: #fff;
    border-color: rgba(0, 240, 255, 0.5);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }
  .tool-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Board */
  .board-wrap {
    position: relative;
    width: min(480px, 92vw);
    aspect-ratio: 1 / 1;
    padding: 12px;
    background: rgba(20, 20, 45, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 20px;
    box-shadow:
      0 0 60px rgba(0, 240, 255, 0.12),
      0 0 100px rgba(255, 43, 214, 0.06),
      inset 0 0 40px rgba(0, 240, 255, 0.03);
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  .cell {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Tiles are absolutely positioned for smooth animation */
  .tile-layer {
    position: absolute;
    inset: 12px;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    border-radius: 10px;
    transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.2s ease;
    will-change: transform;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }

  .tile.new {
    animation: tileAppear 0.2s ease-out;
  }
  @keyframes tileAppear {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .tile.merged {
    animation: tileMerge 0.25s ease-out;
  }
  @keyframes tileMerge {
    0% { transform: scale(1); }
    50% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* Tile colors */
  .tile[data-val="2"]    { background: #1e1e3a; color: #a0a0c0; box-shadow: 0 0 10px rgba(0, 240, 255, 0.15); }
  .tile[data-val="4"]    { background: #2a2a4a; color: #c0c0e0; box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); }
  .tile[data-val="8"]    { background: linear-gradient(135deg, #00f0ff, #0080ff); color: #fff; box-shadow: 0 0 18px rgba(0, 240, 255, 0.6); }
  .tile[data-val="16"]   { background: linear-gradient(135deg, #39ff88, #00b86b); color: #fff; box-shadow: 0 0 20px rgba(57, 255, 136, 0.6); }
  .tile[data-val="32"]   { background: linear-gradient(135deg, #ffe14d, #ff9c00); color: #1a1a3e; box-shadow: 0 0 22px rgba(255, 225, 77, 0.7); }
  .tile[data-val="64"]   { background: linear-gradient(135deg, #ff8a3d, #ff3c00); color: #fff; box-shadow: 0 0 24px rgba(255, 138, 61, 0.75); }
  .tile[data-val="128"]  { background: linear-gradient(135deg, #ff2bd6, #b8009a); color: #fff; box-shadow: 0 0 26px rgba(255, 43, 214, 0.8); font-size: 1.6rem; }
  .tile[data-val="256"]  { background: linear-gradient(135deg, #8b5cf6, #4c1d95); color: #fff; box-shadow: 0 0 28px rgba(139, 92, 246, 0.85); font-size: 1.6rem; }
  .tile[data-val="512"]  { background: linear-gradient(135deg, #00f0ff, #8b5cf6); color: #fff; box-shadow: 0 0 30px rgba(0, 240, 255, 0.9); font-size: 1.6rem; }
  .tile[data-val="1024"] { background: linear-gradient(135deg, #39ff88, #00f0ff); color: #05050f; box-shadow: 0 0 34px rgba(57, 255, 136, 1); font-size: 1.3rem; }
  .tile[data-val="2048"] { background: linear-gradient(135deg, #ffe14d, #ff2bd6); color: #fff; box-shadow: 0 0 40px rgba(255, 225, 77, 1), 0 0 60px rgba(255, 43, 214, 0.8); font-size: 1.3rem; }
  .tile[data-val="4096"] { background: linear-gradient(135deg, #ffffff, #ff2bd6); color: #05050f; box-shadow: 0 0 50px rgba(255, 255, 255, 1); font-size: 1.2rem; }
  .tile[data-val="8192"] { background: linear-gradient(135deg, #ff2bd6, #ffffff); color: #05050f; box-shadow: 0 0 60px rgba(255, 43, 214, 1); font-size: 1.1rem; }
  .tile.big { font-size: 1.1rem; }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    background: rgba(6, 6, 15, 0.92);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    transition: opacity 0.3s ease;
    z-index: 10;
    text-align: center;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
  }

  .overlay.win .overlay-title {
    background: linear-gradient(90deg, var(--neon-yellow), var(--neon-pink), var(--neon-cyan));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: hueRotate 3s linear infinite;
  }
  @keyframes hueRotate {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .overlay-sub {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.65);
    max-width: 320px;
    line-height: 1.6;
  }
  .overlay-sub strong { color: var(--neon-cyan); }

  .btn {
    padding: 11px 34px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 50px rgba(0, 240, 255, 0.8); }
  .btn:active { transform: translateY(0) scale(0.98); }

  .btn.secondary {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: none;
  }
  .btn.secondary:hover {
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }

  .controls-hint {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.5);
    max-width: 340px;
    margin-top: 4px;
  }
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    height: 24px;
    padding: 0 6px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 5px;
    font-size: 0.6rem;
  }

  /* Sound toggle */
  .sound-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 50%;
    color: var(--neon-cyan);
    cursor: pointer;
    font-size: 0.9rem;
    z-index: 30;
    transition: all 0.2s ease;
  }
  .sound-toggle:hover { background: rgba(0, 240, 255, 0.2); }
  .sound-toggle.muted { color: rgba(255, 255, 255, 0.3); }

  /* Floating score popups */
  .popup {
    position: absolute;
    font-weight: 800;
    font-size: 1rem;
    pointer-events: none;
    animation: popupFloat 0.9s ease-out forwards;
    z-index: 8;
    text-shadow: 0 0 12px currentColor;
    font-variant-numeric: tabular-nums;
    transform: translate(-50%, -50%);
  }
  @keyframes popupFloat {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20%  { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -180%) scale(1); }
  }

  .hint {
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.5px;
    text-align: center;
  }

  @media (max-width: 500px) {
    .title { font-size: 1.2rem; letter-spacing: 2px; }
    .score-value { font-size: 0.9rem; }
    .score-box { padding: 5px 10px; min-width: 62px; }
    .board-wrap { padding: 10px; border-radius: 16px; }
    .tile-layer { inset: 10px; }
    .board { gap: 8px; }
    .overlay-title { font-size: 1.5rem; }
    .overlay-sub { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</div>

<div class="game-wrap">
  <div class="header">
    <div class="title">NEON&nbsp;2048</div>
    <div class="scores">
      <div class="score-box" id="scoreBox">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box best">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="undoBtn" disabled title="Undo (U)">↶ Undo</button>
    <button class="tool-btn" id="newBtn" title="New game (N)">✦ New</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="boardBg"></div>
    <div class="tile-layer" id="tileLayer"></div>

    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">NEON 2048</div>
      <div class="overlay-sub" id="overlaySub">
        Combine tiles to reach <strong>2048</strong>.<br/>
        Swipe or use arrow keys.
      </div>
      <button class="btn" id="startBtn">Play</button>
      <div class="controls-hint">
        <span class="key">↑</span>
        <span class="key">↓</span>
        <span class="key">←</span>
        <span class="key">→</span>
        <span class="key">WASD</span>
        <span class="key">U</span>
        <span class="key">N</span>
        <span class="key">R</span>
      </div>
    </div>
  </div>

  <div class="hint">Arrows/WASD · U undo · N new · R restart</div>
</div>

<script>
(() => {
  'use strict';

  // ============================================
  // CONFIG
  // ============================================
  const SIZE = 4;
  const WIN_VALUE = 2048;
  const STORAGE_KEY = 'neon2048';
  const MAX_HISTORY = 10;

  // ============================================
  // DOM
  // ============================================
  const $ = id => document.getElementById(id);
  const boardBg = $('boardBg');
  const tileLayer = $('tileLayer');
  const boardWrap = $('boardWrap');
  const scoreEl = $('score');
  const bestEl = $('best');
  const scoreBox = $('scoreBox');
  const overlay = $('overlay');
  const overlayTitle = $('overlayTitle');
  const overlaySub = $('overlaySub');
  const startBtn = $('startBtn');
  const undoBtn = $('undoBtn');
  const newBtn = $('newBtn');
  const soundToggle = $('soundToggle');

  // ============================================
  // STATE
  // ============================================
  let grid;              // 2D array of tile objects or null: { id, value, row, col, mergedFrom, isNew }
  let score = 0;
  let best = Number(localStorage.getItem('neon2048Best') || 0);
  let nextTileId = 1;
  let history = [];      // stack of snapshots { grid, score }
  let state = 'ready';   // ready | playing | won | gameover
  let wonOnce = false;
  let continueAfterWin = false;
  let soundEnabled = true;
  let animating = false;

  // ============================================
  // AUDIO
  // ============================================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, duration, type = 'sine', volume = 0.05, slideTo = null) {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    g.gain.setValueAtTime(volume, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + duration);
  }

  const sfx = {
    move:   () => beep(220, 0.03, 'triangle', 0.03),
    merge:  (v) => beep(300 + Math.log2(v) * 90, 0.1, 'triangle', 0.06),
    newTile:() => beep(600, 0.05, 'sine', 0.03),
    invalid:() => beep(120, 0.06, 'sawtooth', 0.03),
    win:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.09), i * 90)),
    lose:   () => { beep(300, 0.25, 'sawtooth', 0.08, 150); setTimeout(() => beep(200, 0.4, 'sawtooth', 0.1, 100), 250); },
    undo:   () => beep(500, 0.06, 'sine', 0.05, 800),
  };

  // ============================================
  // BOARD BACKGROUND CELLS
  // ============================================
  function buildBackgroundCells() {
    boardBg.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      boardBg.appendChild(cell);
    }
  }

  // ============================================
  // GRID HELPERS
  // ============================================
  function createGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function emptyCells(g = grid) {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!g[r][c]) cells.push({ r, c });
      }
    }
    return cells;
  }

  function addRandomTile() {
    const empties = emptyCells();
    if (!empties.length) return null;
    const { r, c } = empties[Math.floor(Math.random() * empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = { id: nextTileId++, value, row: r, col: c, isNew: true };
    grid[r][c] = tile;
    return tile;
  }

  // ============================================
  // RENDERING
  // ============================================
  function getCellSize() {
    // The tile layer is inside the board wrap's 12px padding, board has gaps
    const layerW = tileLayer.clientWidth;
    const gap = parseFloat(getComputedStyle(boardBg).gap) || 10;
    return (layerW - gap * (SIZE - 1)) / SIZE;
  }

  function getCellPos(row, col) {
    const size = getCellSize();
    const gap = parseFloat(getComputedStyle(boardBg).gap) || 10;
    return {
      x: col * (size + gap),
      y: row * (size + gap),
      size,
    };
  }

  // Track tiles by id → DOM element for smooth animation
  const tileEls = new Map();

  function renderBoard(animateMovement = false) {
    // Collect live tile ids
    const liveIds = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = grid[r][c];
        if (!tile) continue;
        liveIds.add(tile.id);
      }
    }

    // Remove DOM elements for tiles no longer in grid (merged away)
    for (const [id, el] of tileEls) {
      if (!liveIds.has(id)) {
        el.remove();
        tileEls.delete(id);
      }
    }

    // Position/update each tile
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = grid[r][c];
        if (!tile) continue;

        let el = tileEls.get(tile.id);
        if (!el) {
          // Create element
          el = document.createElement('div');
          el.className = 'tile new';
          el.dataset.val = tile.value;
          el.textContent = tile.value;
          tileLayer.appendChild(el);
          tileEls.set(tile.id, el);
          // Force reflow so transition applies
          void el.offsetWidth;
          el.classList.remove('new');
        } else {
          // Update value if it changed (from merge)
          if (el.dataset.val !== String(tile.value)) {
            el.dataset.val = tile.value;
            el.textContent = tile.value;
            el.classList.add('merged');
            setTimeout(() => el.classList.remove('merged'), 260);
          }
        }

        // Position
        const { x, y, size } = getCellPos(r, c);
        const fontSize = calculateFontSize(size, tile.value);
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.style.fontSize = fontSize + 'px';
      }
    }
  }

  function calculateFontSize(cellSize, value) {
    const digits = String(value).length;
    if (digits <= 2) return cellSize * 0.42;
    if (digits === 3) return cellSize * 0.35;
    if (digits === 4) return cellSize * 0.28;
    return cellSize * 0.22;
  }

  // ============================================
  // MOVEMENT LOGIC
  // ============================================
  // Direction: 0=up, 1=right, 2=down, 3=left
  function getVector(dir) {
    return [
      { dr: -1, dc: 0 },   // up
      { dr: 0, dc: 1 },    // right
      { dr: 1, dc: 0 },    // down
      { dr: 0, dc: -1 },   // left
    ][dir];
  }

  function traverseOrder(dir) {
    const rows = [...Array(SIZE).keys()];
    const cols = [...Array(SIZE).keys()];
    const { dr, dc } = getVector(dir);

    // Traverse starting from the far side in the move direction
    const rOrder = dr > 0 ? rows.reverse() : rows;
    const cOrder = dc > 0 ? cols.reverse() : cols;

    const positions = [];
    for (const r of rOrder) {
      for (const c of cOrder) {
        positions.push({ r, c });
      }
    }
    return positions;
  }

  function move(dir) {
    if (state !== 'playing') return;
    if (animating) return;

    // Save snapshot for undo
    const snapshot = {
      grid: grid.map(row => row.map(t => t ? { ...t } : null)),
      score,
    };

    const { dr, dc } = getVector(dir);
    const positions = traverseOrder(dir);

    let moved = false;
    const mergedThisTurn = new Set();  // tile ids that already merged this move

    // Track original positions so we can detect real movement
    for (const { r, c } of positions) {
      const tile = grid[r][c];
      if (!tile) continue;

      // Find the farthest position this tile can slide to
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr;
        const tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        const next = grid[tr][tc];
        if (next === null) {
          nr = tr; nc = tc;
        } else if (next.value === tile.value && !mergedThisTurn.has(next.id)) {
          // Merge into next
          grid[tr][tc] = {
            id: next.id,
            value: next.value * 2,
            row: tr, col: tc,
          };
          grid[r][c] = null;
          mergedThisTurn.add(next.id);
          score += next.value * 2;
          moved = true;

          // Check for win
          if (next.value * 2 === WIN_VALUE && !wonOnce) {
            wonOnce = true;
            // Defer win until after animation
            setTimeout(() => triggerWin(), 250);
          }

          // Score popup
          const { x, y, size } = getCellPos(tr, tc);
          const cx = x + size / 2;
          const cy = y + size / 2;
          showPopup(cx, cy, '+' + (next.value * 2), '#00f0ff');
          sfx.merge(next.value * 2);

          tile = null;  // stop processing this tile
          break;
        } else {
          break;
        }
      }
      if (!tile) continue;

      // Move to the empty spot found
      if (nr !== r || nc !== c) {
        grid[nr][nc] = grid[r][c];
        grid[r][c] = null;
        moved = true;
      }
    }

    if (moved) {
      // Add a new tile
      setTimeout(() => {
        addRandomTile();
        renderBoard(true);
        updateHUD();
        checkGameOver();
      }, 60);

      // Push to history BEFORE the new tile shows
      history.push(snapshot);
      if (history.length > MAX_HISTORY) history.shift();
      updateUndoButton();

      renderBoard(true);
      updateHUD();
      sfx.move();
    } else {
      sfx.invalid();
      // Small shake feedback
      boardWrap.classList.remove('shake');
      void boardWrap.offsetWidth;
      boardWrap.classList.add('shake');
      setTimeout(() => boardWrap.classList.remove('shake'), 400);
    }
  }

  function showPopup(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'popup';
    el.textContent = text;
    el.style.color = color;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    tileLayer.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ============================================
  // GAME STATE
  // ============================================
  function updateHUD() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('neon2048Best', best);
    }
    // Bump animation
    scoreBox.classList.remove('bump');
    void scoreBox.offsetWidth;
    scoreBox.classList.add('bump');
    setTimeout(() => scoreBox.classList.remove('bump'), 260);
  }

  function checkGameOver() {
    if (emptyCells().length > 0) return;
    // Check for any possible merge
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return;
      }
    }
    gameOver();
  }

  function gameOver() {
    state = 'gameover';
    sfx.lose();
    overlay.classList.remove('win');
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.innerHTML = `Final score: <strong>${score}</strong><br/>Best: <strong>${best}</strong>`;
    startBtn.textContent = 'Try Again';
    overlay.classList.remove('hidden');
  }

  function triggerWin() {
    if (state !== 'playing') return;
    state = 'won';
    sfx.win();
    overlay.classList.add('win');
    overlayTitle.textContent = '🎉 YOU WIN! 🎉';
    overlaySub.innerHTML = `You reached <strong>2048</strong>!<br/>Score: <strong>${score}</strong>`;
    startBtn.textContent = 'Keep Going';
    overlay.classList.remove('hidden');
  }

  // ============================================
  // UNDO
  // ============================================
  function undo() {
    if (!history.length) return;
    if (state === 'gameover' || state === 'won') {
      overlay.classList.add('hidden');
      state = 'playing';
    }
    const snapshot = history.pop();
    grid = snapshot.grid;
    score = snapshot.score;

    // Clear all DOM tiles and re-render from grid
    for (const [id, el] of tileEls) el.remove();
    tileEls.clear();

    updateHUD();
    renderBoard();
    updateUndoButton();
    sfx.undo();
  }

  function updateUndoButton() {
    undoBtn.disabled = history.length === 0;
  }

  // ============================================
  // NEW GAME
  // ============================================
  function newGame() {
    ensureAudio();
    grid = createGrid();
    score = 0;
    history = [];
    nextTileId = 1;
    wonOnce = false;
    continueAfterWin = false;
    animating = false;

    // Clear DOM
    for (const [id, el] of tileEls) el.remove();
    tileEls.clear();

    // Add two starting tiles
    addRandomTile();
    addRandomTile();

    state = 'playing';
    overlay.classList.add('hidden');
    overlay.classList.remove('win');
    updateHUD();
    renderBoard();
    updateUndoButton();
    sfx.newTile();
  }

  // ============================================
  // INPUT
  // ============================================
  const keyMap = {
    ArrowUp: 0, w: 0, W: 0,
    ArrowRight: 1, d: 1, D: 1,
    ArrowDown: 2, s: 2, S: 2,
    ArrowLeft: 3, a: 3, A: 3,
  };

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
    if (e.key === 'u' || e.key === 'U') { e.preventDefault(); undo(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newGame(); return; }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); newGame(); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'ready' || state === 'gameover') newGame();
      else if (state === 'won') continueGame();
      return;
    }

    if (state !== 'playing') return;
    if (e.key in keyMap) {
      e.preventDefault();
      move(keyMap[e.key]);
    }
  });

  // Touch swipe
  let touchStart = null;
  boardWrap.addEventListener('touchstart', e => {
    if (state !== 'playing') return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  boardWrap.addEventListener('touchend', e => {
    if (!touchStart || state !== 'playing') return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 30) { touchStart = null; return; }

    if (adx > ady) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
    touchStart = null;
  }, { passive: true });

  // ============================================
  // BUTTONS
  // ============================================
  function continueGame() {
    state = 'playing';
    continueAfterWin = true;
    overlay.classList.add('hidden');
    overlay.classList.remove('win');
  }

  startBtn.addEventListener('click', () => {
    if (state === 'won') continueGame();
    else newGame();
  });

  undoBtn.addEventListener('click', undo);
  newBtn.addEventListener('click', newGame);

  // ============================================
  // SOUND TOGGLE
  // ============================================
  function toggleSound() {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
    soundToggle.classList.toggle('muted', !soundEnabled);
    if (soundEnabled) { ensureAudio(); beep(660, 0.08, 'sine', 0.05); }
    localStorage.setItem('neon2048Sound', soundEnabled ? '1' : '0');
  }
  soundToggle.addEventListener('click', toggleSound);

  // ============================================
  // RESIZE
  // ============================================
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (state === 'playing' || state === 'won' || state === 'gameover') {
        renderBoard();
      }
    }, 100);
  });

  // ============================================
  // BOOT
  // ============================================
  buildBackgroundCells();
  if (localStorage.getItem('neon2048Sound') === '0') {
    soundEnabled = false;
    soundToggle.textContent = '🔇';
    soundToggle.classList.add('muted');
  }
  bestEl.textContent = best;
  grid = createGrid();
})();
</script>

</body>
