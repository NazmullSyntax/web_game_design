<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2bd6;
    --neon-purple: #8b5cf6;
    --bg-dark: #0a0a1a;
    --bg-panel: rgba(20, 20, 45, 0.7);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1a1a3e 0%, #05050f 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 16px;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }

  .game-container {
    position: relative;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 24px;
    padding: 24px;
    box-shadow:
      0 0 60px rgba(0, 240, 255, 0.15),
      0 0 100px rgba(255, 43, 214, 0.08),
      inset 0 0 40px rgba(0, 240, 255, 0.05);
    animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 16px;
  }

  .title {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
  }

  .scores {
    display: flex;
    gap: 20px;
  }

  .score-box {
    text-align: right;
  }

  .score-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.5);
  }

  .score-value {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--neon-cyan);
    text-shadow: 0 0 15px var(--neon-cyan);
    font-variant-numeric: tabular-nums;
  }

  .score-value.high {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .canvas-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    line-height: 0;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
  }

  canvas {
    display: block;
    background: #06060f;
    border-radius: 16px;
  }

  /* Overlay for start / game over */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(6, 6, 15, 0.85);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    gap: 16px;
    transition: opacity 0.3s ease;
    z-index: 10;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay-title {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .overlay-sub {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }

  .btn {
    margin-top: 8px;
    padding: 12px 36px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    font-family: inherit;
  }

  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.8);
  }

  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  .controls {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    font-size: 0.8rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 8px;
    box-shadow: 0 2px 0 rgba(0, 240, 255, 0.15);
  }

  .hint {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin-top: 16px;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
  }

  .dpad button {
    background: rgba(0, 240, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--neon-cyan);
    font-size: 1.3rem;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .dpad button:active {
    background: rgba(0, 240, 255, 0.25);
  }

  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  @media (max-width: 560px) {
    .title { font-size: 1.1rem; }
    .score-value { font-size: 1.1rem; }
    .game-container { padding: 16px; border-radius: 18px; }
    .dpad { display: grid; }
    .controls { display: none; }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">NEON&nbsp;SNAKE</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value high" id="highScore">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">NEON SNAKE</div>
      <div class="overlay-sub" id="overlaySub">
        Eat the glowing orbs.<br/>Don't hit the walls or yourself.
      </div>
      <button class="btn" id="startBtn">Play</button>
    </div>
  </div>

  <div class="controls">
    <span class="key">↑</span>
    <span class="key">←</span>
    <span class="key">↓</span>
    <span class="key">→</span>
    <span class="key">or WASD</span>
  </div>
  <div class="hint">Press <strong>Space</strong> to pause</div>

  <div class="dpad">
    <button class="up"    data-dir="up">▲</button>
    <button class="left"  data-dir="left">◀</button>
    <button class="down"  data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Config ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 24;                 // cells per row/column
  const CELL = canvas.width / GRID; // pixel size of each cell
  const TICK_MS = 110;             // base speed

  const scoreEl = document.getElementById('score');
  const highEl  = document.getElementById('highScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub   = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');

  // ---------- State ----------
  let snake, dir, nextDir, food, score, highScore, state, tickTimer, particles, foodPulse;

  highScore = Number(localStorage.getItem('neonSnakeHigh') || 0);
  highEl.textContent = highScore;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid,     y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    particles = [];
    foodPulse = 0;
    scoreEl.textContent = '0';
    placeFood();
    state = 'ready';
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  // ---------- Particles ----------
  function spawnParticles(gx, gy, color) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        size: 2 + Math.random() * 3,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= 0.035;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Game logic ----------
  function step() {
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver();
    }
    // Self collision (ignore the tail that's about to move)
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(food.x, food.y, '#ff2bd6');
      placeFood();
      // Speed up slightly as score grows, capped
      clearInterval(tickTimer);
      const speed = Math.max(55, TICK_MS - Math.floor(score / 50) * 6);
      tickTimer = setInterval(step, speed);
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    clearInterval(tickTimer);
    spawnParticles(snake[0].x, snake[0].y, '#00f0ff');

    if (score > highScore) {
      highScore = score;
      highEl.textContent = highScore;
      localStorage.setItem('neonSnakeHigh', highScore);
    }

    overlayTitle.textContent = 'GAME OVER';
    overlaySub.innerHTML = `You scored <strong>${score}</strong> points.<br/>Try again?`;
    startBtn.textContent = 'Retry';
    overlay.classList.remove('hidden');
  }

  // ---------- Rendering ----------
  function drawGrid() {
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      const p = i * CELL;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
    }
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSnake() {
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, snake.length - 1); // 0 = head, 1 = tail
      const pad = 2 + t * 3;
      const x = s.x * CELL + pad;
      const y = s.y * CELL + pad;
      const size = CELL - pad * 2;

      // Interpolate color from cyan (head) to purple (tail)
      const r = Math.round(0   + t * 139);
      const g = Math.round(240 - t * 157);
      const b = Math.round(255 - t * 9);
      const color = `rgb(${r}, ${g}, ${b})`;

      ctx.shadowColor = i === 0 ? '#00f0ff' : color;
      ctx.shadowBlur = i === 0 ? 20 : 8;
      ctx.fillStyle = color;
      roundedRect(x, y, size, size, Math.min(6, size / 3));
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Eyes on head
    const head = snake[0];
    const hx = head.x * CELL;
    const hy = head.y * CELL;
    ctx.fillStyle = '#06060f';
    const eyeOff = CELL * 0.28;
    const eyeR = CELL * 0.09;

    let e1x, e1y, e2x, e2y;
    if (dir.x === 1)       { e1x = hx + CELL - eyeOff; e1y = hy + eyeOff;      e2x = hx + CELL - eyeOff; e2y = hy + CELL - eyeOff; }
    else if (dir.x === -1) { e1x = hx + eyeOff;        e1y = hy + eyeOff;      e2x = hx + eyeOff;        e2y = hy + CELL - eyeOff; }
    else if (dir.y === 1)  { e1x = hx + eyeOff;        e1y = hy + CELL - eyeOff; e2x = hx + CELL - eyeOff; e2y = hy + CELL - eyeOff; }
    else                   { e1x = hx + eyeOff;        e1y = hy + eyeOff;      e2x = hx + CELL - eyeOff; e2y = hy + eyeOff; }

    ctx.beginPath(); ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2); ctx.fill();
  }

  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(foodPulse) * 0.15;
    const r = (CELL * 0.32) * pulse;

    ctx.shadowColor = '#ff2bd6';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#ff2bd6';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Inner highlight
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    if (state === 'ready' || state === 'playing' || state === 'paused' || state === 'over') {
      drawFood();
      drawSnake();
    }
    drawParticles();
  }

  // ---------- Loop ----------
  let lastTime = 0;
  function loop(t) {
    const dt = t - lastTime;
    lastTime = t;
    foodPulse += dt * 0.006;
    updateParticles();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  function setDir(nx, ny) {
    // Prevent reversing directly into self
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  const keyMap = {
    ArrowUp:    [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown:  [0,  1], s: [0,  1], S: [0,  1],
    ArrowLeft:  [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1,  0], d: [1,  0], D: [1,  0],
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing') {
        state = 'paused';
        clearInterval(tickTimer);
        overlayTitle.textContent = 'PAUSED';
        overlaySub.textContent = 'Press Space or click Resume to continue.';
        startBtn.textContent = 'Resume';
        overlay.classList.remove('hidden');
      } else if (state === 'paused') {
        state = 'playing';
        overlay.classList.add('hidden');
        tickTimer = setInterval(step, Math.max(55, TICK_MS - Math.floor(score / 50) * 6));
      }
      return;
    }
    const k = keyMap[e.key];
    if (k) {
      e.preventDefault();
      if (state === 'playing') setDir(k[0], k[1]);
    }
  });

  // Mobile D-pad
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      const map = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
      const d = map[btn.dataset.dir];
      if (d && state === 'playing') setDir(d[0], d[1]);
    });
  });

  // Touch swipe on canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart || state !== 'playing') return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  // ---------- Start / Restart ----------
  function startGame() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    clearInterval(tickTimer);
    tickTimer = setInterval(step, TICK_MS);
  }

  startBtn.addEventListener('click', () => {
    if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
      tickTimer = setInterval(step, Math.max(55, TICK_MS - Math.floor(score / 50) * 6));
    } else {
      startGame();
    }
  });

  // ---------- Boot ----------
  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
